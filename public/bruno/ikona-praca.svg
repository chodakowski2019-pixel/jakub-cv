<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 12.11 (USER_001): ikona do paska /praca: jak ikona.svg, ale białe kółko na środku i większe (w pasku ikona jest przycięta do koła). -->
  <defs>
    <linearGradient id="tlo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a24a"/>
      <stop offset=".42" stop-color="#8a4414"/>
      <stop offset=".78" stop-color="#1a0d05"/>
      <stop offset="1" stop-color="#0b0704"/>
    </linearGradient>
    <radialGradient id="blask" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tlo)"/>
  <circle cx="32" cy="32" r="26" fill="url(#blask)"/>
  <circle cx="32" cy="32" r="16" fill="#fff"/>
</svg>
